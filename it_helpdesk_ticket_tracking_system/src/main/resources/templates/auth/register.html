<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Help Desk System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="/css/auth.css" rel="stylesheet" />
</head>
<body>
<div class="container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h1>Create Account</h1>
            <p>Register for Help Desk System</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <!-- ✅ IMPORTANT: add th:object -->
        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="auth-form register-form">

            <div class="form-group">
                <label for="name">
                    <i class="fas fa-user"></i>
                    Full Name
                </label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter your full name" required />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <input type="email" id="email" th:field="*{email}" placeholder="Enter your email" required />
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>
                <div class="password-input">
                    <input type="password" id="password" th:field="*{password}" placeholder="Enter your password" required />
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i>
                    Confirm Password
                </label>
                <div class="password-input">
                    <!-- th:field is required: a plain id with no name attribute is never sent
                         with the form, so RegisterRequest.confirmPassword (@NotBlank) always
                         failed validation and the registration silently bounced back to this
                         same blank form with no visible error. -->
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Confirm your password" required />
                    <button type="button" class="toggle-password" onclick="toggleConfirmPassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error-text"></span>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-user-plus"></i>
                Sign Up
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a th:href="@{/auth/login}">Sign In</a></p>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
